[package]
name                   = "apigw"
description            = "Self-hosted gateway that serves an existing Amazon API Gateway's routes"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[lints]
workspace = true

[dependencies]
apigw-regex          = { workspace = true }
anyhow               = { workspace = true, features = ["std"] }
aws-lc-rs            = { workspace = true, features = ["aws-lc-sys", "alloc"] }
aws-config           = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-apigateway   = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-apigatewayv2 = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-firehose     = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-lambda       = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3           = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-xray         = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum                 = { workspace = true, features = ["http1", "http2", "tokio", "json", "original-uri"] }
base64               = { workspace = true, features = ["std"] }
clap                 = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context"] }
flate2               = { workspace = true, features = ["rust_backend"] }
hyper                = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util           = { workspace = true, features = ["server-auto", "service", "tokio"] }
ipnet                = { workspace = true, features = ["std"] }
jiff                 = { workspace = true, features = ["std"] }
jsonwebtoken         = { workspace = true, features = ["aws_lc_rs"] }
matchit              = { workspace = true }
proxy-header         = { workspace = true, features = ["tokio"] }
reqwest              = { workspace = true, features = ["rustls", "http2", "stream"] }
rustls               = { workspace = true, features = ["aws-lc-rs", "std", "tls12", "prefer-post-quantum"] }
serde                = { workspace = true, features = ["std", "derive"] }
serde_json           = { workspace = true, features = ["std"] }
thiserror            = { workspace = true, features = ["std"] }
tokio                = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-std", "io-util"] }
tokio-rustls         = { workspace = true, features = ["aws-lc-rs", "tls12"] }
tokio-util           = { workspace = true }
tower                = { workspace = true, features = ["util"] }
tracing              = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber   = { workspace = true, features = ["std", "fmt", "env-filter", "ansi", "json"] }
uuid                 = { workspace = true, features = ["std", "v7"] }
x509-parser          = { workspace = true }

[dev-dependencies]
tokio                = { workspace = true, features = ["test-util"] }
rcgen                = { workspace = true, features = ["aws_lc_rs", "pem"] }
proptest             = { workspace = true, features = ["std"] }
