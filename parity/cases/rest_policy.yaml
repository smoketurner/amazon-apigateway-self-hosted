cases:
  # Resource policies are not evaluated yet; APIs that carry one answer 403 for
  # every route, so the allowed route is a known gap and the denied route matches.
  - name: policy-open-route
    api: rest_policy
    path: /open
    known_gap: "#37"
    compare:
      headers: [content-type]

  - name: policy-ip-denied
    api: rest_policy
    path: /ip-denied
    compare:
      body: ignore
