cases:
  - name: http-http-proxy-greedy
    api: http
    path: /http-proxy/x/y
    query: {k: v}
    compare:
      headers: [content-type]
      body: ignore
      echo: {}

  - name: http-lambda-v2
    api: http
    path: /lambda-v2/x
    query: {k: v}
    compare:
      body: ignore
      echo: {fields: [method, query, resource, path_parameters]}

  # API Gateway puts the stage name in rawPath
  - name: http-lambda-v2-raw-path
    api: http
    path: /lambda-v2/x
    query: {k: v}
    compare:
      body: ignore
      echo: {fields: [path]}

  - name: http-lambda-v1
    api: http
    path: /lambda-v1/x
    query: {k: v}
    compare:
      body: ignore
      echo: {fields: [method, query, resource, path_parameters]}

  - name: http-jwt-authorizer-missing-token
    api: http
    path: /authz/jwt
    compare:
      headers: [content-type, www-authenticate]

  # A refused token: WWW-Authenticate says why, in API Gateway's words
  - name: http-jwt-authorizer-not-a-token
    api: http
    path: /authz/jwt
    headers: {Authorization: garbage}
    compare:
      headers: [content-type, www-authenticate]

  - name: http-jwt-authorizer-bad-base64
    api: http
    path: /authz/jwt
    headers: {Authorization: Bearer a.b.c}
    compare:
      headers: [content-type, www-authenticate]

  - name: http-jwt-authorizer-lower-case-bearer
    api: http
    path: /authz/jwt
    headers: {Authorization: bearer a.b.c}
    compare:
      headers: [content-type, www-authenticate]

  # {"alg":"HS256","typ":"JWT"}.{}.sig
  - name: http-jwt-authorizer-hmac
    api: http
    path: /authz/jwt
    headers: {Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.c2ln}
    compare:
      headers: [content-type, www-authenticate]

  # {"alg":"RS256"}.{}.sig
  - name: http-jwt-authorizer-no-key-id
    api: http
    path: /authz/jwt
    headers: {Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.e30.c2ln}
    compare:
      headers: [content-type, www-authenticate]

  # The challenge names the scopes the route asks for
  - name: http-jwt-authorizer-scoped-not-a-token
    api: http
    path: /authz/jwt-scoped
    headers: {Authorization: Bearer x}
    compare:
      headers: [content-type, www-authenticate]

  # A backend request that names no type: none for a GET, a form otherwise.
  # (The recorded echo keeps neither Via nor Content-Length.)
  - name: http-http-proxy-get-without-a-type
    api: http
    path: /http-proxy/x
    compare:
      headers: [content-type]
      body: ignore
      echo: {headers: [content-type]}

  - name: http-http-proxy-post-without-a-type
    api: http
    method: POST
    path: /http-proxy/x
    compare:
      headers: [content-type]
      body: ignore
      echo: {headers: [content-type]}

  - name: http-lambda-authorizer-missing-identity
    api: http
    path: /authz/lambda-simple
    compare:
      headers: [content-type]

  # Parameter mapping (overwrite/append/remove) is not applied yet
  - name: http-parameter-mapping
    api: http
    path: /mapped/42
    query: {q: "1"}
    compare:
      body: ignore
      echo: {headers: [x-appended]}

  # Lambda events, compared whole (per-request and per-deployment keys are masked)
  - name: http-lambda-v2-event
    api: http
    path: /lambda-v2/a%20b%2Fc/d?q=x%20y%2B&z=1+2&z=3
    headers: {X-Custom: A, Cookie: "a=1; b=2"}
    compare:
      body: json

  - name: http-lambda-v1-event
    api: http
    path: /lambda-v1/a%20b%2Fc/d?q=x%20y%2B&z=1+2&z=3
    headers: {X-Custom: A, Cookie: "a=1; b=2"}
    compare:
      body: json

  - name: http-lambda-v2-event-post
    api: http
    method: POST
    path: /lambda-v2/items
    headers: {content-type: application/json}
    body: '{"name":"widget"}'
    compare:
      body: json

  # Slashes: doubled ones collapse, and a greedy parameter may be empty
  - name: http-lambda-v2-double-slash
    api: http
    path: /lambda-v2/a//b/
    compare:
      body: json

  - name: http-lambda-v2-empty-greedy
    api: http
    path: /lambda-v2/
    compare:
      body: json

  # A trailing slash is not the route: this reaches $default, not GET /authz/jwt
  - name: http-trailing-slash
    api: http
    path: /authz/jwt/
    compare:
      headers: [content-type]
      body: json

  - name: http-http-proxy-escaped-path
    api: http
    path: /http-proxy/a%20b%2Fc/d?q=x%20y%2B&z=1+2
    compare:
      body: ignore
      echo: {fields: [path, query]}


  # CORS, from the API's configuration (https://example.com is the allowed origin)
  - name: http-cors-preflight
    api: http
    method: OPTIONS
    path: /lambda-v2/x
    headers:
      Origin: https://example.com
      Access-Control-Request-Method: POST
      Access-Control-Request-Headers: content-type
    unrecorded: true
    compare:
      headers: [access-control-allow-origin, access-control-allow-methods, access-control-allow-headers, access-control-max-age, access-control-expose-headers, access-control-allow-credentials, vary, content-type]

  - name: http-cors-preflight-disallowed-origin
    api: http
    method: OPTIONS
    path: /lambda-v2/x
    headers:
      Origin: https://not-allowed.example
      Access-Control-Request-Method: POST
    unrecorded: true
    compare:
      headers: [access-control-allow-origin, access-control-allow-methods, access-control-allow-headers, access-control-max-age, vary, content-type]

  - name: http-cors-preflight-disallowed-method
    api: http
    method: OPTIONS
    path: /lambda-v2/x
    headers:
      Origin: https://example.com
      Access-Control-Request-Method: DELETE
    unrecorded: true
    compare:
      headers: [access-control-allow-origin, access-control-allow-methods, access-control-allow-headers, access-control-max-age, vary, content-type]

  - name: http-cors-allowed-origin
    api: http
    path: /lambda-v2/x
    headers: {Origin: https://example.com}
    unrecorded: true
    compare:
      headers: [access-control-allow-origin, access-control-expose-headers, access-control-allow-credentials, vary]
      body: ignore

  - name: http-cors-disallowed-origin
    api: http
    path: /lambda-v2/x
    headers: {Origin: https://not-allowed.example}
    unrecorded: true
    compare:
      headers: [access-control-allow-origin, access-control-expose-headers, access-control-allow-credentials, vary]
      body: ignore
