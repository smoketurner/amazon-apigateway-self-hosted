# The bridge between the Lambda Web Adapter (plain HTTP on loopback) and apigw
# (TLS only). It passes requests through untouched and removes two kinds of
# response header a function URL cannot carry.
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  access_log off;
  server_tokens off;

  # Only /tmp is writable in a Lambda sandbox.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # apigw decides what a request may look like, not the bridge.
  client_max_body_size 0;
  large_client_header_buffers 8 32k;
  underscores_in_headers on;
  ignore_invalid_headers off;
  merge_slashes off;

  server {
    listen 127.0.0.1:8080;

    location / {
      # No URI on proxy_pass: the request line goes upstream as it arrived.
      proxy_pass https://127.0.0.1:8443;
      proxy_ssl_verify off;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      # The function URL and the Lambda Web Adapter describe the invocation in
      # request headers API Gateway's clients never send; apigw would pass them on
      # to integrations.
      more_clear_input_headers 'x-amzn-tls-*' x-amzn-request-context x-amzn-lambda-context;
      proxy_read_timeout 35s;

      # A function URL renames the x-amzn-* and Date headers of a response to
      # x-amzn-Remapped-*. A response that already has headers under those
      # names, as an HTTP_PROXY integration's does, is answered 502.
      more_clear_headers 'x-amzn-remapped-*';
      # nginx's own, which apigw never sends.
      more_clear_headers Server;
    }
  }
}
