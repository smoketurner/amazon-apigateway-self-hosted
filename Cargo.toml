[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98.1"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/smoketurner/amazon-apigateway-self-hosted"
publish      = false

[workspace.dependencies]
anyhow               = { version = "=1.0.104", default-features = false }
apigw-regex          = { path = "crates/apigw-regex" }
apigw-vtl            = { path = "crates/apigw-vtl" }
aws-config           = { version = "=1.12.0", default-features = false }
aws-lc-rs            = { version = "=1.18.1", default-features = false }
aws-sdk-apigateway   = { version = "=1.119.0", default-features = false }
aws-sdk-apigatewayv2 = { version = "=1.117.0", default-features = false }
aws-sdk-cloudwatchlogs = { version = "=1.156.0", default-features = false }
aws-sdk-firehose     = { version = "=1.123.0", default-features = false }
aws-sdk-lambda       = { version = "=1.148.0", default-features = false }
aws-sigv4            = { version = "=1.6.0", default-features = false }
aws-sdk-s3           = { version = "=1.152.0", default-features = false }
aws-sdk-xray         = { version = "=1.114.0", default-features = false }
axum                 = { version = "=0.8.9", default-features = false }
base64               = { version = "=0.23.1", default-features = false }
clap                 = { version = "=4.6.6", default-features = false }
fancy-regex          = { version = "=0.19.2", default-features = false }
flate2               = { version = "=1.1.10", default-features = false }
hyper                = { version = "=1.11.1", default-features = false }
hyper-util           = { version = "=0.1.21", default-features = false }
indexmap             = { version = "=2.14.2", default-features = false }
ipnet                = { version = "=2.12.2", default-features = false }
jiff                 = { version = "=0.2.35", default-features = false }
jsonschema           = { version = "=0.58.4", default-features = false }
jsonwebtoken         = { version = "=11.1.0", default-features = false }
matchit              = { version = "=0.8.4", default-features = false }
proxy-header         = { version = "=0.1.3", default-features = false }
proptest             = { version = "=1.11.0", default-features = false }
rcgen                = { version = "=0.14.10", default-features = false }
redis                = { version = "=1.7.1", default-features = false }
reqwest              = { version = "=0.13.5", default-features = false }
rustls               = { version = "=0.23.45", default-features = false }
serde                = { version = "=1.0.229", default-features = false }
serde-saphyr         = { version = "=1.3.0", default-features = false }
serde_json           = { version = "=1.0.151", default-features = false }
thiserror            = { version = "=2.0.20", default-features = false }
tokio                = { version = "=1.53.1", default-features = false }
tokio-rustls         = { version = "=0.26.6", default-features = false }
tokio-util           = { version = "=0.7.19", default-features = false }
tower                = { version = "=0.5.3", default-features = false }
tracing              = { version = "=0.1.44", default-features = false }
tracing-subscriber   = { version = "=0.3.23", default-features = false }
uuid                 = { version = "=1.26.1", default-features = false }
x509-parser          = { version = "=0.18.1", default-features = false }

[workspace.lints.rust]
unsafe_code           = "deny"
unreachable_pub       = "warn"
non_ascii_idents      = "deny"
trivial_casts         = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes      = "warn"
single_use_lifetimes  = "warn"
unused_qualifications = "warn"
unused_import_braces  = "warn"
unused_macro_rules    = "warn"
let_underscore_drop   = "warn"
redundant_lifetimes   = "warn"
unit_bindings         = "warn"
elided_lifetimes_in_paths      = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse  = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

absolute_paths = "deny"

unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
unreachable         = "deny"
todo                = "deny"
unimplemented       = "deny"
exit                = "deny"
unwrap_in_result    = "deny"
panic_in_result_fn  = "deny"
get_unwrap          = "deny"

indexing_slicing    = "deny"
string_slice        = "deny"

modulo_arithmetic       = "deny"
integer_division        = "deny"
arithmetic_side_effects = "deny"

cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
cast_possible_wrap       = "deny"
cast_precision_loss      = "deny"
checked_conversions      = "deny"

unchecked_time_subtraction = "deny"
float_cmp           = "deny"
float_cmp_const     = "deny"
lossy_float_literal = "deny"
zero_divided_by_zero = "deny"

fallible_impl_from   = "deny"
recursive_format_impl = "deny"

large_stack_arrays  = "deny"
large_stack_frames  = "deny"
infinite_iter       = "deny"

mem_replace_with_uninit = "deny"
uninit_assumed_init     = "deny"
uninit_vec              = "deny"

await_holding_lock = "deny"
large_futures      = "deny"
mem_forget         = "deny"
mutex_atomic       = "deny"

dbg_macro          = "deny"
print_stdout       = "deny"
print_stderr       = "deny"
rc_buffer          = "deny"
map_unwrap_or      = "deny"
let_underscore_must_use = "deny"

clone_on_ref_ptr        = "deny"
deref_by_slicing        = "deny"
needless_collect        = "deny"
needless_pass_by_ref_mut = "deny"
needless_raw_strings    = "deny"
or_fun_call             = "deny"
redundant_clone         = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
str_to_string           = "deny"
string_add              = "deny"
format_push_string      = "deny"
use_self                = "deny"
if_then_some_else_none  = "deny"
useless_let_if_seq      = "deny"
equatable_if_let        = "deny"
branches_sharing_code   = "deny"
unnecessary_self_imports = "deny"
unnecessary_struct_initialization = "deny"
unneeded_field_pattern  = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
empty_drop              = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
iter_on_single_items    = "deny"
iter_on_empty_collections = "deny"
nonstandard_macro_braces = "deny"
derive_partial_eq_without_eq = "deny"

let_underscore_untyped  = "deny"
unused_result_ok        = "deny"
try_err                 = "deny"
collection_is_never_read = "deny"
unused_peekable         = "deny"

significant_drop_in_scrutinee = "deny"
mixed_read_write_in_expression = "deny"
debug_assert_with_mut_call = "deny"
suspicious_xor_used_as_pow = "deny"
set_contains_or_insert  = "deny"
read_zero_byte_vec      = "deny"
path_buf_push_overwrite = "deny"
pathbuf_init_then_push  = "deny"
filetype_is_file        = "deny"
fn_to_numeric_cast_any  = "deny"
as_underscore           = "deny"
infinite_loop           = "deny"
non_send_fields_in_send_ty = "deny"
string_lit_as_bytes     = "deny"
string_lit_chars_any    = "deny"
verbose_file_reads      = "deny"
clear_with_drain        = "deny"
while_float             = "deny"
imprecise_flops         = "deny"
suboptimal_flops        = "deny"
mutex_integer           = "deny"
rc_mutex                = "deny"

cfg_not_test            = "deny"
redundant_test_prefix   = "deny"

allow_attributes              = "deny"
allow_attributes_without_reason = "deny"

too_many_lines = "warn"

module_name_repetitions = "allow"
similar_names           = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
