# Values for the apigw chart. Every apigw flag has an APIGW_* environment
# variable (docs/configuration.md); anything without a value here goes in `extraEnv`.

image:
  repository: ghcr.io/smoketurner/amazon-apigateway-self-hosted
  # Defaults to the chart's appVersion.
  tag: ""
  # Set by the release workflow to the multi-arch index it pushed. When set, the
  # pod pulls `repository@digest` and `tag` is ignored.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Also passed as APIGW_REPLICAS, which divides throttle limits between replicas
# unless `valkey` shares them.
replicaCount: 2

# Exactly one of restApiId, httpApiId, domainNames, or openapiFile.
api:
  # REST API (v1) to mirror. Requires `stage`.
  restApiId: ""
  # HTTP API (v2) to mirror. Requires `stage`.
  httpApiId: ""
  # Custom domain names whose mapped APIs are served. Excludes `stage`,
  # `basePath`, and the cache.
  domainNames: []
  # Where the domains' certificates come from:
  # - `files`: `tls` is served for every domain. For a certificate per domain,
  #   mount `<domain>/tls.crt` and `<domain>/tls.key` with `extraVolumes` and
  #   `extraVolumeMounts`, and set APIGW_DOMAIN_CERT_DIR to the mount in
  #   `extraEnv`.
  # - `acm`: exports the certificate API Gateway serves for each domain (it
  #   must be an ACM exportable certificate). `tls` is served until the first
  #   export succeeds. The gateway's role needs acm:DescribeCertificate and
  #   acm:ExportCertificate on those certificates.
  domainCertSource: files
  # Path of an OpenAPI export mounted with `extraVolumes`; `type` is `rest` or `http`.
  openapiFile: ""
  type: rest
  stage: ""
  basePath: ""
  # name: value pairs, set as APIGW_STAGE_VARIABLE_<name>.
  stageVariables: {}

# apigw resolves AWS credentials and region the way the AWS CLI and SDKs do:
# environment variables, shared config and credentials files, a profile, SSO,
# credential_process, a web identity token, then container and instance
# metadata; or from IAM Roles Anywhere when `rolesAnywhere.roleArn` is set.
# Nothing here is required; set what your environment uses.
aws:
  region: ""
  profile: ""
  # Paths of a shared config and credentials file, set as AWS_CONFIG_FILE and
  # AWS_SHARED_CREDENTIALS_FILE when not empty. Mount the files with
  # `extraVolumes` and `extraVolumeMounts`.
  configFile: ""
  sharedCredentialsFile: ""
  # Secret whose keys are environment variable names, for example
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN.
  existingSecret: ""
  # Projects a service account token and sets AWS_ROLE_ARN and
  # AWS_WEB_IDENTITY_TOKEN_FILE, for a role that trusts the cluster's OIDC issuer.
  webIdentity:
    roleArn: ""
    audience: sts.amazonaws.com
    expirationSeconds: 3600
  # IAM Roles Anywhere: apigw exchanges an X.509 certificate for the role's
  # credentials itself (no helper binary). Used when `roleArn` is set. Name a
  # `kubernetes.io/tls` Secret holding the certificate, have cert-manager issue
  # one, or have csi-driver issue one per pod, from an issuer whose CA is the
  # trust anchor. The files are re-read on every refresh, so renewals need no
  # restart.
  rolesAnywhere:
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    # 900 to 43200; the profile can lower the maximum.
    sessionSeconds: 3600
    existingSecret: ""
    certManager:
      enabled: false
      # The certificate's common name. Defaults to the release's full name.
      commonName: ""
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
    # Or have cert-manager's csi-driver issue each pod its own certificate when
    # it starts and renew it in place, with no Secret stored in the cluster.
    # Needs csi-driver installed; use it instead of existingSecret and
    # certManager.
    csiDriver:
      enabled: false
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      # csi-driver expands ${POD_NAME}, ${POD_NAMESPACE}, ${POD_UID}, and
      # ${SERVICE_ACCOUNT_NAME}, and needs at least one DNS name.
      commonName: "${POD_NAME}.${POD_NAMESPACE}"
      dnsNames: "${POD_NAME}.${POD_NAMESPACE}"
      # RSA (2048 to 4096) or ECDSA (256, 384, or 521).
      keyAlgorithm: ECDSA
      keySize: 256
      duration: 24h
      # The image's nonroot group, so apigw can read the key.
      fsGroup: 65532

# Every listener is TLS. Name a `kubernetes.io/tls` Secret, or have cert-manager
# issue one. The files are re-read when they change.
tls:
  existingSecret: ""
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    # Defaults to the Service's in-cluster names.
    dnsNames: []

# Last-known-good API definition, used when AWS is unreachable at startup. An
# emptyDir survives container restarts but not rescheduling; name a claim to
# keep it longer. Not used with `api.domainNames`.
cache:
  enabled: true
  existingClaim: ""

# Secret holding a `rediss://` URL that shares throttle, quota, and authorizer
# cache state between replicas.
valkey:
  existingSecret: ""
  secretKey: url

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 443
  annotations: {}

# The admin listener (/healthz, /routes, /metrics) is used by the probes and is
# never added to the Service: /routes lists every backend target.
adminPort: 9443
containerPort: 8443

# Prometheus metrics, served on /metrics of the admin listener over TLS (the
# pod's own certificate, so scrapers either trust its CA or skip verification).
# Worth alerting on: time since apigw_config_last_success_timestamp_seconds
# (a gateway that stopped refreshing), apigw_tls_certificate_expiry_seconds,
# rises in apigw_config_refreshes_total{outcome!~"unchanged|swapped"} and
# apigw_usage_refreshes_total{outcome="failure"}, apigw_routes_unservable,
# apigw_state_errors_total, and the 5xx share of apigw_requests_total.
metrics:
  # prometheus.io/scrape, scheme, port, and path annotations on the pod.
  scrapeAnnotations: false
  # TLS settings for the Prometheus Operator monitors below.
  tlsConfig:
    insecureSkipVerify: true
  # A Prometheus Operator PodMonitor for the admin port.
  podMonitor:
    enabled: false
    interval: 30s
    # Labels your Prometheus selects monitors by.
    labels: {}
  # A Prometheus Operator ServiceMonitor. It needs a Service for the admin
  # port, so the chart adds `<fullname>-metrics`, which also reaches /routes.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# OpenTelemetry export of metrics and request spans (APIGW_OTEL). Any other
# OTEL_* variable (headers, sampler, per-signal endpoints) goes in `extraEnv`.
otel:
  enabled: false
  # OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://otel-collector.observability:4318
  endpoint: ""
  # OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf or grpc.
  protocol: http/protobuf
  # OTEL_SERVICE_NAME; apigw when empty.
  serviceName: ""
  # OTEL_RESOURCE_ATTRIBUTES, as name: value pairs. The pod, namespace, node,
  # container, and deployment are set from the downward API already.
  resourceAttributes: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

istio:
  # A DestinationRule telling the mesh to originate TLS to the pod.
  destinationRule:
    enabled: false
    # Defaults to <service>.<namespace>.svc; must be a name on the certificate.
    sni: ""

resources: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Above the 30 s connection drain.
terminationGracePeriodSeconds: 45

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
