apiVersion: v1
kind: Service
metadata:
  name: {{ include "apigw.fullname" . }}
  labels:
    {{- include "apigw.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "apigw.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      # Tells a service mesh the traffic is already TLS.
      appProtocol: https
